name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Backend (Go)
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server ./cmd/server

      - name: Upload Backend binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.157.242.133
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "backend/server"
          target: "/tmp"
          strip_components: 1

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 43.157.242.133
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Memulai proses deploy ke VPS..."
            cd /var/www/portfolio

            # 1. Sinkronisasi kode terbaru dari git main (reset perubahan lokal pada package-lock jika ada)
            echo "📥 Mengambil kode terbaru dari branch main..."
            git fetch origin main
            git checkout -- frontend/package-lock.json 2>/dev/null || true
            git reset --hard origin/main

            # 2. Pasang binary Backend (Go) hasil build runner
            echo "📦 Memasang binary Backend (Go)..."
            mv -f /tmp/server /var/www/portfolio/backend/server
            chmod +x /var/www/portfolio/backend/server

            # 3. Build Frontend (Next.js)
            echo "📦 Memasang dependensi & build Frontend..."
            cd /var/www/portfolio/frontend
            npm install --legacy-peer-deps
            npm run build

            # 4. Reload PM2 (Zero Downtime)
            echo "🔄 Reload proses PM2..."
            cd /var/www/portfolio
            pm2 reload ecosystem.config.js --update-env
            pm2 save

            echo "🎉 Deploy selesai dengan sukses!"

