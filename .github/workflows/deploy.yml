name: Deploy Portfolio to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 Memulai proses deploy ke VPS..."
            cd /var/www/portfolio

            # 1. Sinkronisasi kode terbaru dari git main (reset perubahan lokal pada package-lock jika ada)
            echo "📥 Mengambil kode terbaru dari branch main..."
            git fetch origin main
            git checkout -- frontend/package-lock.json backend/package-lock.json 2>/dev/null || true
            git reset --hard origin/main

            # 2. Build Backend (NestJS)
            echo "📦 Memasang dependensi & build Backend..."
            cd /var/www/portfolio/backend
            npm install --legacy-peer-deps
            npm run build

            # 3. Build Frontend (Next.js)
            echo "📦 Memasang dependensi & build Frontend..."
            cd /var/www/portfolio/frontend
            npm install --legacy-peer-deps
            npm run build

            # 4. Reload PM2 (Zero Downtime)
            echo "🔄 Reload proses PM2..."
            cd /var/www/portfolio
            pm2 reload ecosystem.config.js --update-env
            pm2 save

            echo "🎉 Deploy selesai dengan sukses!"

