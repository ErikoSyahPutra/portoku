# ==============================================================================
# 1. FRONTEND: erikosyah.my.id
# ==============================================================================
server {
    listen 80;
    server_name erikosyah.my.id www.erikosyah.my.id;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==============================================================================
# 2. BACKEND API: api.erikosyah.my.id
# ==============================================================================
server {
    listen 80;
    server_name api.erikosyah.my.id;

    # Izinkan upload foto/file portofolio hingga 50MB
    client_max_body_size 50M;

    # Gambar upload disajikan langsung oleh Nginx dari disk dan di-cache lama.
    # Nama file unik (timestamp), jadi isinya tidak pernah berubah.
    location /uploads/ {
        alias /var/www/portfolio/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
